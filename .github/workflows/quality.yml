name: Kwaliteitscontrole

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v7

      - name: Node.js instellen
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Afhankelijkheden installeren
        run: npm ci

      - name: Lint, TypeScript, tests en build
        run: npm run check
